[tool.poetry]
name = "qute_style"
version = "1.0.10"
description = "QuteStyle is an expandable application framework for PySide6"
authors = ["Marina Baumgartner, Dairen Gonschior, Tilman Krummeck, Dennis Spitzhorn, Gerhard Trapp, Patrick Zwerschke <PS-TF-Entwicklung@tuev-sued.de>"]
readme = "README.md"
repository = "https://github.com/TUV-SUD-Product-Service-GmbH/QuteStyle"
license = "MIT"
packages = [
    {include = "qute_style"},
    {include = "qute_style_examples"},
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
PySide6 = "6.11.2"

[tool.poetry.dev-dependencies]
pytest = "9.1.1"
pytest-qt = "4.5.0"
requests = "2.34.2"
black = "26.5.1"
coverage = "7.16.1"
isort = "9.0.1"
mypy = "2.3.1"
pre-commit = "4.6.2"
pytest-cov = "^7.1.0"
pytest-github-actions-annotate-failures = "^0.4.2"
ruff = "^0.16.8"
types-requests = "2.33.0.20260906"


[tool.poetry.scripts]
qute-style-example = "qute_style_examples.main:main_method"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Decrease the maximum line length to 79 characters.
line-length = 79
target-version = "py311"
src = ["qute_style", "qute_style_examples", "tests", "dev_scripts"]
extend-exclude = ["gen", "ui", "resources", "resources_rc.py"]

[tool.ruff.lint]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "Q",   # flake8-quotes
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "UP",  # pyupgrade
  "D",   # pydocstyle
  #"I",   # isort - differs from regular isort a little bit
  # see -> https://docs.astral.sh/ruff/faq/#how-does-ruffs-import-sorting-compare-to-isort
  "N",   # pep8-naming
  "W",   # warning
  "PL",  # Pylint
  "PGH", # pygrep-hooks
  "PD",  # pandas-vet
  "FLY", # flynt
  "NPY", # NumPy-specific rules
  "PERF",# Perflint
  "RUF", # Ruff-specific rules
]

# general ignore:
# multi-line-summary-first-line, mutable-class-default,
# magic-value-comparison, yoda-conditions, function-call-in-default-argument,
# expr-or-true, blanket-type-ignore, bare-except,
# too-many-positional-arguments (Qt widgets take a lot of ctor arguments),
# import-outside-top-level (used to break import cycles in tests)
ignore = [
  "D212",
  "RUF012",
  "PLR2004",
  "SIM300",
  "B008",
  "SIM222",
  "PGH003",
  "E722",
  "PLR0917",
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]  # undocumented-public-package

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-branches = 14
